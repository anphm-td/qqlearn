<!DOCTYPE html><html lang="vi"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding — Mục tiêu học</title>
  <meta name="view-transition" content="same-origin">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FBF6EE;
      --card: #FFFFFF;
      --rule: #F0E6D6;
      --ink: #45403A;
      --muted: #9A9188;
      --teal: #4EB09B;
      --teal-soft: #E4F3EF;
      --coral: #F28076;
      --butter: #FEE686;
      --yellow-note: #FFD273;
    }
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      color: var(--ink);
      margin: 0;
    }
    .display-font { font-family: 'Bricolage Grotesque', sans-serif; }
    .data-font { font-family: 'Quicksand', sans-serif; }
    .pencil-texture {
      background-image: repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(78, 176, 155, 0.15) 2px, rgba(78, 176, 155, 0.15) 4px);
    }
    .double-border-top {
      border-top: 3px double var(--rule);
    }
    .bubble-oval {
      border-radius: 50% / 50%;
    }
    .washi-tape {
      height: 8px;
      width: 60px;
      background-color: var(--yellow-note);
      opacity: 0.85;
      transform: rotate(-1.5deg);
      position: absolute;
      top: -4px;
      left: 20px;
    }
    .highlight-butter {
      background: linear-gradient(180deg, transparent 60%, var(--butter) 60%);
    }
    @view-transition {
      navigation: auto;
    }
  </style>
</head>
<body class="bg-[#FBF6EE]">
  <div class="w-full min-h-screen flex flex-col items-center justify-start bg-[#FBF6EE]">
    <div class="w-full max-w-[390px] min-h-screen bg-[#FBF6EE] flex flex-col relative overflow-hidden">
      
      <!-- Header Progress -->
      <header class="shrink-0 pt-14 px-6 flex items-center justify-between">
        <a href="#" id="nav-back-link" class="text-[#9A9188] flex items-center justify-center w-9 h-9 rounded-full border border-[#F0E6D6] bg-white">
          <iconify-icon icon="lucide:chevron-left" class="text-xl"></iconify-icon>
        </a>
        <div class="flex gap-2.5">
          <div class="w-3 h-3 bubble-oval bg-[#4EB09B]"></div>
          <div class="w-3 h-3 bubble-oval border border-[#F0E6D6] bg-white"></div>
          <div class="w-3 h-3 bubble-oval border border-[#F0E6D6] bg-white"></div>
        </div>
        <div class="w-9"></div>
      </header>

      <main class="flex-1 px-6 pt-10 flex flex-col">
        <div class="mb-8">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-2 h-2 rounded-full bg-[#4EB09B]"></div>
            <span class="text-[14px] font-semibold lowercase text-[#9A9188]">bước 1/3: mục tiêu ngày</span>
          </div>
          <h1 class="text-[32px] display-font text-[#45403A] leading-[1.2]">
            Bạn muốn học <span class="highlight-butter">bao nhiêu tiếng</span> mỗi ngày?
          </h1>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
          <!-- Preset Bubbles -->
          <button id="preset-30m" class="bg-white border-2 border-dashed border-[#F0E6D6] rounded-[16px] p-4 text-center hover:bg-white/50 transition-colors">
            <span class="data-font text-lg font-bold block">30 phút</span>
            <span class="text-[12px] text-[#9A9188] block">duy trì</span>
          </button>

          <button id="preset-1h" class="bg-white border-2 border-dashed border-[#F0E6D6] rounded-[16px] p-4 text-center hover:bg-white/50 transition-colors">
            <span class="data-font text-lg font-bold block">1 giờ</span>
            <span class="text-[12px] text-[#9A9188] block">ổn định</span>
          </button>

          <button id="preset-1.5h" class="relative bg-white border-2 border-[#4EB09B] rounded-[16px] p-4 text-center overflow-hidden">
            <div class="absolute inset-0 pencil-texture"></div>
            <div class="relative">
              <span class="data-font text-lg font-bold block text-[#4EB09B]">1.5 giờ</span>
              <span class="text-[12px] text-[#4EB09B] font-semibold block">hiệu quả</span>
            </div>
          </button>

          <button id="preset-2h" class="bg-white border-2 border-dashed border-[#F0E6D6] rounded-[16px] p-4 text-center hover:bg-white/50 transition-colors">
            <span class="data-font text-lg font-bold block">2 giờ</span>
            <span class="text-[12px] text-[#9A9188] block">tiến bộ</span>
          </button>
        </div>

        <!-- Custom Stepper Card -->
        <div class="relative bg-white rounded-[12px] border border-[#F0E6D6] p-6 mb-8">
          <div class="washi-tape"></div>
          <div class="absolute top-0 left-0 w-full h-[3px] double-border-top"></div>
          
          <p class="text-[14px] font-semibold mb-4 text-center">Nhập số phút khác</p>
          
          <div class="flex items-center justify-center gap-6">
            <button id="step-down" class="w-10 h-10 rounded-full border-2 border-[#45403A] flex items-center justify-center hover:bg-[#FBF6EE] transition-colors">
              <iconify-icon icon="lucide:minus" class="text-xl"></iconify-icon>
            </button>
            
            <div class="flex flex-col items-center">
              <input type="text" value="90" class="w-24 text-center data-font text-[32px] font-bold text-[#45403A] bg-transparent focus:outline-none" placeholder="0">
              <span class="text-[14px] text-[#9A9188] data-font">phút</span>
            </div>

            <button id="step-up" class="w-10 h-10 rounded-full border-2 border-[#45403A] flex items-center justify-center hover:bg-[#FBF6EE] transition-colors">
              <iconify-icon icon="lucide:plus" class="text-xl"></iconify-icon>
            </button>
          </div>
          
          <div class="mt-6 pt-4 border-t border-dashed border-[#F0E6D6] text-center">
            <p class="text-[13px] italic text-[#9A9188]">
              Bạn có thể tự chỉnh thời lượng này bất cứ lúc nào.
            </p>
          </div>
        </div>

        <!-- Bottom Actions -->
        <div class="mt-auto pb-12">
          <a href="https://p.superdesign.dev/draft/cce4fa55-e39e-46c1-828b-3c775b6eac21" id="cta-continue" class="w-full py-4 bg-[#4EB09B] text-white rounded-[12px] font-semibold text-center block shadow-sm active:scale-[0.98] transition-all">
            Tiếp tục
          </a>
        </div>
      </main>
    </div>
  </div>
</body></html>
