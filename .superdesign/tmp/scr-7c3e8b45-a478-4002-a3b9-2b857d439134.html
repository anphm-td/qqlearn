<!DOCTYPE html><html lang="vi"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/bd211809-846b-4a25-8789-59bc89a6ff1d" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/2ef58c33-a887-4f31-b247-e56becc07419" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/7011f4d6-b188-400d-86eb-67521b4ec70c" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/dc4a9c39-c61f-47b0-bb5b-fda0e623a70b" as="document">
  <style>
    :root {
      --bg: #FBF6EE;
      --card: #FFFFFF;
      --rule: #F0E6D6;
      --ink: #45403A;
      --muted: #9A9188;
      --teal: #4EB09B;
      --teal-soft: #E4F3EF;
      --coral: #F28076;
      --pink-soft: #FFB6AF;
      --butter: #FEE686;
      --toeic: #FFD273;
      --toeic-soft: #FFF3D9;
      --math: #BFAEE3;
      --math-soft: #F1ECFA;
      --japanese: #FEC5E6;
      --japanese-soft: #FFEFF6;
    }
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      color: var(--ink);
      background-color: var(--bg);
    }
    .display-font { font-family: 'Bricolage Grotesque', sans-serif; }
    .data-font { font-family: 'Quicksand', sans-serif; }
    .pencil-texture {
      background-image: repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(78, 176, 155, 0.2) 2px, rgba(78, 176, 155, 0.2) 4px);
    }
    .double-border {
      border-top: 3px double var(--rule);
    }
    .dashed-separator {
      border-top: 1px dashed var(--rule);
    }
    .highlight-butter {
      background: linear-gradient(180deg, transparent 60%, var(--butter) 60%);
    }
    html { background-color: var(--bg); }
    @view-transition { navigation: auto; }
    ::view-transition { background-color: var(--bg); }
    ::view-transition-old(main-nav), ::view-transition-new(main-nav) { animation: none; mix-blend-mode: normal; }
    ::view-transition-old(main-content) { animation: 0.25s ease-out both fade-out; }
    ::view-transition-new(main-content) { animation: 0.25s ease-in 0.1s both fade-in; }
    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="w-full min-h-screen flex flex-col bg-[#FBF6EE]">
    
    <!-- Header -->
    <header class="shrink-0 pt-14 px-4 pb-4 flex justify-between items-end">
      <div>
        <p class="text-[12px] text-[#9A9188] data-font mb-1 uppercase tracking-wider">Tuần này · 03.10</p>
        <h1 class="text-3xl display-font text-[#45403A]">Thống kê</h1>
      </div>
      <div class="w-10 h-10 rounded-full bg-white border border-[#F0E6D6] flex items-center justify-center">
        <iconify-icon icon="lucide:calendar" class="text-xl text-[#9A9188]"></iconify-icon>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto px-4 pb-[100px]" style="view-transition-name: main-content">
      
      <!-- Summary Stats Card -->
      <section class="mt-4">
        <div class="relative bg-white border border-[#F0E6D6] rounded-[24px] p-6 flex flex-col items-center">
          <div class="absolute top-0 left-0 w-full h-[3px] border-t-[3px] border-double border-[#F0E6D6] rounded-t-[24px]"></div>
          
          <div class="flex justify-around w-full">
            <div class="text-center">
              <p class="text-[12px] text-[#9A9188] mb-1">Tổng thời gian</p>
              <p class="text-2xl display-font"><span class="data-font text-[#4EB09B]">9.5</span><span class="text-lg text-[#9A9188] ml-1">h</span></p>
            </div>
            <div class="w-[1px] bg-[#F0E6D6] dashed-separator rotate-180 h-12 self-center"></div>
            <div class="text-center">
              <p class="text-[12px] text-[#9A9188] mb-1">Mục tiêu tuần</p>
              <p class="text-2xl display-font"><span class="data-font text-[#9A9188]">10.5</span><span class="text-lg text-[#9A9188] ml-1">h</span></p>
            </div>
          </div>

          <!-- Weekly Bar Chart -->
          <div class="w-full mt-8 flex items-end justify-between h-32 px-2 relative">
             <!-- Background tint for today -->
             <div class="absolute bottom-0 right-[42px] w-[34px] h-full bg-[#FFF3D9] rounded-t-lg -z-0 opacity-60"></div>

             <div class="flex flex-col items-center gap-2 z-10">
               <div class="w-4 h-16 bg-[#F0E6D6] rounded-full"></div>
               <span class="text-[10px] data-font text-[#9A9188]">T2</span>
             </div>
             <div class="flex flex-col items-center gap-2 z-10">
               <div class="w-4 h-20 bg-[#F0E6D6] rounded-full"></div>
               <span class="text-[10px] data-font text-[#9A9188]">T3</span>
             </div>
             <div class="flex flex-col items-center gap-2 z-10">
               <div class="w-4 h-12 bg-[#F0E6D6] rounded-full"></div>
               <span class="text-[10px] data-font text-[#9A9188]">T4</span>
             </div>
             <div class="flex flex-col items-center gap-2 z-10">
               <div class="w-4 h-24 bg-[#F0E6D6] rounded-full"></div>
               <span class="text-[10px] data-font text-[#9A9188]">T5</span>
             </div>
             <div class="flex flex-col items-center gap-2 z-10">
               <div class="w-4 h-14 bg-[#F0E6D6] rounded-full"></div>
               <span class="text-[10px] data-font text-[#9A9188]">T6</span>
             </div>
             <div class="flex flex-col items-center gap-2 z-10">
               <div class="w-4 h-28 bg-[#4EB09B] rounded-full pencil-texture"></div>
               <span class="text-[10px] data-font text-[#4EB09B] font-bold">T7</span>
             </div>
             <div class="flex flex-col items-center gap-2 z-10">
               <div class="w-4 h-0 bg-[#F0E6D6] rounded-full"></div>
               <span class="text-[10px] data-font text-[#9A9188]">CN</span>
             </div>
          </div>
        </div>
      </section>

      <!-- Subjects Breakdown -->
      <section class="mt-8">
        <div class="flex items-center gap-2 mb-4">
          <h2 class="text-[14px] font-semibold text-[#45403A]">Thời lượng theo môn</h2>
          <div class="w-4 h-[1.5px] bg-[#F0E6D6]"></div>
        </div>

        <div class="bg-white border border-[#F0E6D6] rounded-[16px] p-5 space-y-6">
          <!-- TOEIC -->
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-[#FFD273]"></div>
                <span class="text-[13px] font-medium">TOEIC</span>
              </div>
              <span class="data-font text-[14px] font-bold text-[#45403A]">4.5 <span class="text-[11px] font-normal text-[#9A9188]">giờ</span></span>
            </div>
            <div class="w-full h-2.5 bg-[#F0E6D6] rounded-full overflow-hidden">
              <div class="h-full bg-[#FFD273] rounded-full" style="width: 70%"></div>
            </div>
          </div>

          <!-- Math -->
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-[#BFAEE3]"></div>
                <span class="text-[13px] font-medium">Toán học</span>
              </div>
              <span class="data-font text-[14px] font-bold text-[#45403A]">3.0 <span class="text-[11px] font-normal text-[#9A9188]">giờ</span></span>
            </div>
            <div class="w-full h-2.5 bg-[#F0E6D6] rounded-full overflow-hidden">
              <div class="h-full bg-[#BFAEE3] rounded-full" style="width: 45%"></div>
            </div>
          </div>

          <!-- Japanese -->
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-[#FEC5E6]"></div>
                <span class="text-[13px] font-medium">Tiếng Nhật</span>
              </div>
              <span class="data-font text-[14px] font-bold text-[#45403A]">2.0 <span class="text-[11px] font-normal text-[#9A9188]">giờ</span></span>
            </div>
            <div class="w-full h-2.5 bg-[#F0E6D6] rounded-full overflow-hidden">
              <div class="h-full bg-[#FEC5E6] rounded-full" style="width: 30%"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Mock Test Progress -->
      <section class="mt-8">
        <div class="flex items-center gap-2 mb-4">
          <h2 class="text-[14px] font-semibold text-[#45403A]">Luyện đề TOEIC</h2>
          <div class="w-4 h-[1.5px] bg-[#F0E6D6]"></div>
        </div>

        <div class="relative bg-white border border-[#F0E6D6] rounded-[16px] p-5">
          <div class="absolute top-0 left-0 w-full h-[3px] border-t-[3px] border-double border-[#F0E6D6] rounded-t-[16px]"></div>
          
          <div class="flex justify-between items-end mb-4">
            <div>
              <p class="text-[11px] text-[#9A9188] uppercase tracking-tighter">Điểm trung bình</p>
              <p class="text-2xl display-font text-[#4EB09B]">535</p>
            </div>
            <div class="text-right">
              <p class="text-[11px] text-[#9A9188] uppercase tracking-tighter">Ngày thi</p>
              <p class="text-[14px] font-semibold">14.12.2026</p>
            </div>
          </div>

          <!-- Line Chart SVG -->
          <div class="w-full aspect-[2/1] relative overflow-visible">
            <svg viewBox="0 0 400 200" class="w-full h-full overflow-visible">
              <!-- Target Line -->
              <line x1="0" y1="40" x2="400" y2="40" stroke="#F0E6D6" stroke-width="1.5" stroke-dasharray="6 4" />
              <text x="345" y="30" fill="#9A9188" font-family="Quicksand" font-size="12" font-weight="bold">740</text>

              <!-- Progress Path -->
              <path d="M 50 160 Q 150 120 200 130 T 350 70" fill="none" stroke="#4EB09B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
              
              <!-- Data Points -->
              <circle cx="50" cy="160" r="5" fill="white" stroke="#4EB09B" stroke-width="2" />
              <text x="40" y="185" fill="#45403A" font-family="Quicksand" font-size="10">450</text>

              <circle cx="150" cy="125" r="4" fill="white" stroke="#4EB09B" stroke-width="1.5" />
              <circle cx="250" cy="110" r="4" fill="white" stroke="#4EB09B" stroke-width="1.5" />
              <circle cx="350" cy="70" r="5" fill="#4EB09B" stroke="white" stroke-width="2" />
              <text x="340" y="60" fill="#4EB09B" font-family="Quicksand" font-size="12" font-weight="bold">620</text>
            </svg>
          </div>
          <p class="text-[12px] text-[#9A9188] text-center mt-4 italic">Bạn đang tiến gần hơn tới mục tiêu rồi!</p>
        </div>
      </section>

    </main>

    <!-- Navigation Tab Bar -->
    <footer class="shrink-0 fixed bottom-0 left-0 w-full bg-white border-t border-[#F0E6D6] pb-[34px] pt-3 px-6 z-40" style="view-transition-name: main-nav">
      <div class="flex justify-between items-center max-w-[400px] mx-auto">
        <a href="https://p.superdesign.dev/draft/bd211809-846b-4a25-8789-59bc89a6ff1d" id="nav-home" class="flex flex-col items-center gap-1 text-[#9A9188]">
          <iconify-icon icon="lucide:home" class="text-2xl"></iconify-icon>
          <span class="text-[11px] font-medium">Trang chủ</span>
        </a>
        <a href="https://p.superdesign.dev/draft/2ef58c33-a887-4f31-b247-e56becc07419" id="nav-study" class="flex flex-col items-center gap-1 text-[#9A9188]">
          <iconify-icon icon="lucide:pencil" class="text-2xl"></iconify-icon>
          <span class="text-[11px] font-medium">Học</span>
        </a>
        <a href="https://p.superdesign.dev/draft/7011f4d6-b188-400d-86eb-67521b4ec70c" id="nav-notebook" class="flex flex-col items-center gap-1 text-[#9A9188]">
          <iconify-icon icon="lucide:book-open" class="text-2xl"></iconify-icon>
          <span class="text-[11px] font-medium">Sổ tay</span>
        </a>
        <a href="https://p.superdesign.dev/draft/7c3e8b45-a478-4002-a3b9-2b857d439134" id="nav-stats" class="flex flex-col items-center gap-1 text-[#4EB09B]">
          <iconify-icon icon="lucide:bar-chart-2" class="text-2xl"></iconify-icon>
          <span class="text-[11px] font-medium">Thống kê</span>
        </a>
      </div>
    </footer>

  </div>

</body></html>
