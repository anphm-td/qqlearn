<!DOCTYPE html><html lang="vi"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding — Mục tiêu học</title>
  <meta name="view-transition" content="same-origin">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/bd211809-846b-4a25-8789-59bc89a6ff1d" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/cce4fa55-e39e-46c1-828b-3c775b6eac21" as="document">
  <style>
    :root {
      --bg: #FBF6EE;
      --card: #FFFFFF;
      --rule: #F0E6D6;
      --ink: #45403A;
      --muted: #9A9188;
      --teal: #4EB09B;
      --teal-soft: #E4F3EF;
      --coral: #F28076;
      --pink-soft: #FFB6AF;
      --butter: #FEE686;
    }
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      margin: 0;
    }
    .display-font { font-family: 'Bricolage Grotesque', sans-serif; }
    .data-font { font-family: 'Quicksand', sans-serif; }
    .pencil-texture {
      background-image: repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(78, 176, 155, 0.2) 2px, rgba(78, 176, 155, 0.2) 4px);
    }
    .double-border-top {
      border-top: 3px double var(--rule);
    }
    .bubble-oval {
      border-radius: 50% / 50%;
    }
    .bubble-dashed {
      border: 1.5px dashed var(--rule);
    }
    .bubble-active {
      border: 1.5px solid var(--teal);
      background-color: var(--teal-soft);
    }
    .highlight-butter {
      background: linear-gradient(180deg, transparent 60%, var(--butter) 60%);
    }

    @view-transition {
      navigation: auto;
    }

    ::view-transition-old(main-content) {
      animation: 0.25s ease-out both fade-out;
    }
    ::view-transition-new(main-content) {
      animation: 0.25s ease-in 0.1s both fade-in;
    }

    @keyframes fade-out {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
  </style>
</head>
<body>
  <div class="w-full min-h-screen flex flex-col items-center justify-start bg-[#FBF6EE]">
    <!-- Mobile Container -->
    <div class="w-[390px] min-h-screen bg-[#FBF6EE] flex flex-col relative overflow-hidden shadow-2xl md:shadow-none">
      
      <!-- Top Navigation & Progress -->
      <nav class="shrink-0 pt-16 px-6 flex items-center justify-between">
        <a href="https://p.superdesign.dev/draft/bd211809-846b-4a25-8789-59bc89a6ff1d" class="text-[#9A9188] flex items-center justify-center w-8 h-8 rounded-full border border-[#F0E6D6] bg-white">
          <iconify-icon icon="lucide:chevron-left" class="text-xl"></iconify-icon>
        </a>
        <div class="flex gap-2">
          <div class="w-3 h-3 bubble-oval bg-[#4EB09B]"></div>
          <div class="w-3 h-3 bubble-oval border border-[#F0E6D6] bg-white"></div>
          <div class="w-3 h-3 bubble-oval border border-[#F0E6D6] bg-white"></div>
        </div>
        <div class="w-8"></div> <!-- Spacer for balance -->
      </nav>

      <!-- Main Area -->
      <main style="view-transition-name: main-content" class="flex-1 px-6 pt-10 flex flex-col">
        <header class="mb-8">
          <p class="text-[12px] text-[#9A9188] data-font mb-2 uppercase tracking-wide">Bước 1: Mục tiêu</p>
          <h1 class="text-3xl display-font text-[#45403A] leading-tight">
            Bạn muốn học <span class="highlight-butter">bao nhiêu tiếng</span> mỗi ngày?
          </h1>
        </header>

        <div class="space-y-4">
          <!-- Option 1 -->
          <div class="bg-white border border-[#F0E6D6] rounded-[16px] p-5 flex items-center justify-between bubble-dashed">
            <div class="flex items-center gap-4">
              <div class="w-6 h-6 bubble-oval border border-[#F0E6D6] flex items-center justify-center">
                <div class="w-3 h-3 bubble-oval bg-transparent"></div>
              </div>
              <span class="text-[16px] font-semibold">30 phút</span>
            </div>
            <span class="text-[13px] text-[#9A9188] italic">Duy trì thói quen</span>
          </div>

          <!-- Option 2 -->
          <div class="bg-white border border-[#F0E6D6] rounded-[16px] p-5 flex items-center justify-between bubble-dashed">
            <div class="flex items-center gap-4">
              <div class="w-6 h-6 bubble-oval border border-[#F0E6D6] flex items-center justify-center">
                <div class="w-3 h-3 bubble-oval bg-transparent"></div>
              </div>
              <span class="text-[16px] font-semibold">1 giờ</span>
            </div>
            <span class="text-[13px] text-[#9A9188] italic">Nhịp độ ổn định</span>
          </div>

          <!-- Option 3: Active Selection -->
          <div class="bg-white border border-[#4EB09B] rounded-[16px] p-5 flex items-center justify-between relative overflow-hidden">
             <div class="absolute inset-0 pencil-texture opacity-30"></div>
             <div class="relative flex items-center justify-between w-full">
                <div class="flex items-center gap-4">
                  <div class="w-6 h-6 bubble-oval border-2 border-[#4EB09B] flex items-center justify-center bg-white">
                    <div class="w-3 h-3 bubble-oval bg-[#4EB09B]"></div>
                  </div>
                  <span class="text-[16px] font-bold text-[#4EB09B]">1.5 giờ</span>
                </div>
                <span class="text-[13px] text-[#4EB09B] font-medium">Hiệu quả nhất</span>
             </div>
          </div>

          <!-- Option 4 -->
          <div class="bg-white border border-[#F0E6D6] rounded-[16px] p-5 flex items-center justify-between bubble-dashed">
            <div class="flex items-center gap-4">
              <div class="w-6 h-6 bubble-oval border border-[#F0E6D6] flex items-center justify-center">
                <div class="w-3 h-3 bubble-oval bg-transparent"></div>
              </div>
              <span class="text-[16px] font-semibold">2 giờ</span>
            </div>
            <span class="text-[13px] text-[#9A9188] italic">Tiến bộ nhanh</span>
          </div>

          <!-- Option 5 -->
          <div class="bg-white border border-[#F0E6D6] rounded-[16px] p-5 flex items-center justify-between bubble-dashed">
            <div class="flex items-center gap-4">
              <div class="w-6 h-6 bubble-oval border border-[#F0E6D6] flex items-center justify-center">
                <div class="w-3 h-3 bubble-oval bg-transparent"></div>
              </div>
              <span class="text-[16px] font-semibold">3 giờ</span>
            </div>
            <span class="text-[13px] text-[#9A9188] italic">Bứt tốc mục tiêu</span>
          </div>
        </div>

        <!-- CTA Area -->
        <div class="mt-auto pb-12">
          <div class="bg-white rounded-[16px] border border-[#F0E6D6] p-4 relative mb-6">
            <div class="absolute top-0 left-0 w-full h-[3px] double-border-top rounded-t-[16px]"></div>
            <p class="text-[13px] text-center italic text-[#9A9188]">
              Bạn có thể thay đổi mục tiêu này bất cứ lúc nào trong phần Cài đặt.
            </p>
          </div>
          
          <a href="https://p.superdesign.dev/draft/cce4fa55-e39e-46c1-828b-3c775b6eac21" id="cta-continue-onboarding" class="w-full py-4 bg-[#4EB09B] text-white rounded-[12px] font-semibold text-center block shadow-sm hover:scale-[0.99] transition-transform">
            Tiếp tục
          </a>
        </div>
      </main>

    </div>
  </div>
</body></html>
