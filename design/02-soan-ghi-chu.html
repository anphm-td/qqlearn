<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FBF6EE;
      --card: #FFFFFF;
      --rule: #F0E6D6;
      --ink: #45403A;
      --muted: #9A9188;
      --teal: #4EB09B;
      --teal-soft: #E4F3EF;
      --coral: #F28076;
      --pink-soft: #FFB6AF;
      --butter: #FEE686;
      --toeic: #FFD273;
      --toeic-soft: #FFF3D9;
      --math: #BFAEE3;
      --math-soft: #F1ECFA;
      --japanese: #FEC5E6;
      --japanese-soft: #FFEFF6;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Be Vietnam Pro', sans-serif;
      color: var(--ink);
      background-color: var(--bg);
    }

    .display-font { font-family: 'Bricolage Grotesque', sans-serif; }
    .data-font { font-family: 'Quicksand', sans-serif; }

    .double-border { border-top: 3px double var(--rule); }
    .dashed-separator { border-top: 1px dashed var(--rule); }
    
    .washi-tape {
      height: 8px;
      width: 60%;
      background-color: var(--toeic);
      opacity: 0.85;
      transform: rotate(-1deg);
      margin-left: 20px;
      border-radius: 2px;
    }

    .pencil-texture {
      background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(69, 64, 58, 0.1) 2px, rgba(69, 64, 58, 0.1) 4px);
    }

    @view-transition {
      navigation: auto;
    }

    ::view-transition-old(main-content) {
      animation: 0.25s ease-out both fade-out;
    }
    ::view-transition-new(main-content) {
      animation: 0.25s ease-in 0.1s both fade-in;
    }

    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="w-full h-screen bg-[#FBF6EE] flex flex-col mx-auto relative overflow-hidden">
    
    <!-- Header -->
    <header class="shrink-0 pt-14 px-6 pb-2 flex items-center justify-between">
      <a href="#" id="btn-close-editor" class="w-10 h-10 flex items-center justify-center rounded-full border border-[#F0E6D6] bg-white">
        <iconify-icon icon="lucide:x" class="text-xl text-[#9A9188]"></iconify-icon>
      </a>
      <span class="text-[14px] font-semibold text-[#45403A]">Soạn ghi chú</span>
      <button class="text-[14px] font-semibold text-[#4EB09B]" id="btn-save-top">Lưu</button>
    </header>

    <!-- Main Editor -->
    <main class="flex-1 overflow-y-auto px-6 pb-32" style="view-transition-name: main-content">
      
      <!-- Washi Tape Effect -->
      <div class="mt-4 -mb-1 relative z-10">
        <div class="washi-tape"></div>
      </div>

      <!-- Note Card -->
      <div class="bg-white border border-[#F0E6D6] rounded-[12px] overflow-hidden">
        <div class="h-[3px] double-border"></div>
        <div class="p-5 space-y-4">
          <!-- Title -->
          <input type="text" 
            class="w-full text-2xl display-font text-[#45403A] placeholder-[#9A9188] focus:outline-none bg-transparent"
            placeholder="Tiêu đề..."
            value="Hôm nay học được gì?">
          
          <!-- Content Area -->
          <textarea 
            class="w-full min-h-[140px] text-[15px] leading-relaxed text-[#45403A] placeholder-[#9A9188] focus:outline-none bg-transparent resize-none"
            placeholder="Bạn vừa học được gì...">Tập trung tốt vào buổi sáng để giải đề TOEIC. 
Cần luyện thêm phần nghe Part 1 vì vẫn còn sai những lỗi cơ bản về giới từ.
Định lí Pytago áp dụng khá mượt cho các bài tập tam giác vuông.</textarea>
        </div>
      </div>

      <!-- Subject Selection -->
      <section class="mt-8">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-[14px] font-semibold text-[#45403A]">Gắn môn</span>
          <div class="w-4 h-[1px] bg-[#F0E6D6]"></div>
        </div>
        <div class="flex flex-wrap gap-3">
          <!-- Active TOEIC -->
          <button id="subject-toeic" class="flex items-center gap-2 px-4 py-2 bg-[#FFF3D9] border border-[#FFD273] rounded-full">
            <div class="w-2.5 h-2.5 rounded-full bg-[#FFD273]"></div>
            <span class="text-[14px] font-medium text-[#45403A]">TOEIC</span>
          </button>
          <button id="subject-math" class="flex items-center gap-2 px-4 py-2 bg-white border border-[#F0E6D6] rounded-full">
            <div class="w-2.5 h-2.5 rounded-full bg-[#BFAEE3]"></div>
            <span class="text-[14px] font-medium text-[#9A9188]">Toán</span>
          </button>
          <button id="subject-japanese" class="flex items-center gap-2 px-4 py-2 bg-white border border-[#F0E6D6] rounded-full">
            <div class="w-2.5 h-2.5 rounded-full bg-[#FEC5E6]"></div>
            <span class="text-[14px] font-medium text-[#9A9188]">Tiếng Nhật</span>
          </button>
        </div>
      </section>

      <!-- Note Type -->
      <section class="mt-8">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-[14px] font-semibold text-[#45403A]">Loại note</span>
          <div class="w-4 h-[1px] bg-[#F0E6D6]"></div>
        </div>
        <div class="flex flex-wrap gap-2">
          <button class="px-3 py-1.5 border border-[#F0E6D6] rounded-lg text-[13px] text-[#9A9188] bg-white">Từ vựng</button>
          <button class="px-3 py-1.5 border border-[#F0E6D6] rounded-lg text-[13px] text-[#9A9188] bg-white">Lỗi sai</button>
          <button class="px-3 py-1.5 border border-[#F0E6D6] rounded-lg text-[13px] text-[#9A9188] bg-white">Ghi chú</button>
          <!-- Active Tổng kết ngày -->
          <button class="px-3 py-1.5 bg-[#4EB09B] border border-[#4EB09B] rounded-lg text-[13px] text-white font-medium">Tổng kết ngày</button>
        </div>
      </section>

      <!-- Session Link -->
      <section class="mt-8">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-[14px] font-semibold text-[#45403A]">Liên kết buổi học</span>
          <div class="w-4 h-[1px] bg-[#F0E6D6]"></div>
        </div>
        <div class="flex items-center justify-between p-3 bg-white border border-[#F0E6D6] rounded-[10px]">
          <div class="flex items-center gap-3">
            <iconify-icon icon="lucide:clock-3" class="text-[#4EB09B]"></iconify-icon>
            <div class="flex flex-col">
              <span class="text-[14px] font-semibold text-[#45403A]">Buổi sáng · 25 phút</span>
              <span class="text-[12px] text-[#9A9188] data-font uppercase">08:30 · 03.10.2026</span>
            </div>
          </div>
          <button id="link-session-btn" class="w-8 h-8 flex items-center justify-center rounded-full bg-[#E4F3EF] text-[#4EB09B]">
            <iconify-icon icon="lucide:paperclip"></iconify-icon>
          </button>
        </div>
      </section>

      <!-- Action Buttons -->
      <div class="mt-10 space-y-3">
        <button class="w-full py-4 bg-[#4EB09B] text-white rounded-[12px] font-bold text-[16px] active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
          Lưu vào sổ
          <iconify-icon icon="lucide:check" class="text-xl"></iconify-icon>
        </button>
        <button class="w-full py-4 border-2 border-[#F28076] text-[#F28076] rounded-[12px] font-semibold text-[15px] active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
          Xoá ghi chú
          <iconify-icon icon="lucide:trash-2" class="text-lg"></iconify-icon>
        </button>
      </div>
    </main>

    <!-- Tab Bar -->
    <footer class="shrink-0 fixed bottom-0 left-0 right-0 bg-white border-t border-[#F0E6D6] pb-[34px] pt-3 px-6 z-40">
      <div class="flex justify-between items-center max-w-[400px] mx-auto">
        <a href="#" id="nav-home-link" class="flex flex-col items-center gap-1 text-[#9A9188]">
          <iconify-icon icon="lucide:home" class="text-2xl"></iconify-icon>
          <span class="text-[11px] font-medium">Trang chủ</span>
        </a>
        <a href="#" id="nav-study-link" class="flex flex-col items-center gap-1 text-[#9A9188]">
          <iconify-icon icon="lucide:timer" class="text-2xl"></iconify-icon>
          <span class="text-[11px] font-medium">Học</span>
        </a>
        <a href="#" id="nav-notebook-link" class="flex flex-col items-center gap-1 text-[#4EB09B]">
          <iconify-icon icon="lucide:sticky-note" class="text-2xl"></iconify-icon>
          <span class="text-[11px] font-medium">Sổ tay</span>
        </a>
        <a href="#" id="nav-stats-link" class="flex flex-col items-center gap-1 text-[#9A9188]">
          <iconify-icon icon="lucide:bar-chart-3" class="text-2xl"></iconify-icon>
          <span class="text-[11px] font-medium">Thống kê</span>
        </a>
      </div>
    </footer>

  </div>
</body>
</html>
